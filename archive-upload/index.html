<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Twitterアーカイブ追加 | シャリオ</title>
<meta name="theme-color" content="#0F1419">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../xarchive-add.css">
</head>
<body>

<header class="xaa-header">
  <div class="xaa-logo" aria-hidden="true">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="14" width="48" height="36" rx="6" fill="#fff"/>
      <path d="M20 26h24M20 33h24M20 40h14" stroke="#0F1419" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M44 44l8 8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Twitterアーカイブ追加</h1>
  <p class="xaa-sub">X公式アーカイブをアップロード</p>
</header>

<main class="xaa-main">

  <!-- アップロード -->
  <section class="xaa-card" id="upload-section">
    <h2 class="xaa-card-title">アーカイブ追加</h2>
    <div class="xaa-form-group">
      <label>アーカイブの account.js と tweets.js / tweets-part*.js を選択（複数可）</label>
      <input type="file" id="xa-add-files" class="xaa-input" accept=".js,application/javascript,text/javascript" multiple>
      <div class="xaa-note" style="margin-bottom:0">X公式アーカイブ内の data/account.js と data/tweets.js（分割時は tweets-part1.js 等も全て）をまとめて選択してください。ハンドル名・表示名は account.js から自動取得します。DM等その他のファイルは選ばないでください。処理はブラウザ内で行われ、本文・日時・メディアURLのみが抽出・アップロードされます。</div>
    </div>
    <button type="button" id="xa-add-upload-btn" class="xaa-btn primary" style="width:100%" onclick="xaUpload()">解析してアップロード</button>
    <div id="xa-add-progress" class="xaa-status"></div>
    <div id="xa-add-status" class="xaa-status"></div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../xarchive-add.js"></script>
</body>
</html>
